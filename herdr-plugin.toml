id = "joaoptpsa.pane-picker"
name = "Pane Picker"
version = "0.2.0"
min_herdr_version = "0.9.2"
description = "Focus a Herdr pane by typing its on-pane character hint"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Pick a pane"
contexts = ["workspace"]
command = ["python3", "pane_picker.py", "open"]

# The popup covers the whole pane area: it paints a copy of every pane with
# its hint on top, since Herdr no longer lets a plugin draw over other panes.
[[panes]]
id = "picker"
title = "Pane picker"
placement = "popup"
width = "100%"
height = "100%"
command = ["python3", "pane_picker.py", "pick"]
